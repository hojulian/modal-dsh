name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Cutting a release: run this workflow manually on `main`. The version comes
  # from package.json — bump it in a normal PR first. The `v<version>` tag
  # cannot be pushed from a source commit, because it has to land on the built
  # commit for `#semver:` to resolve to something installable (see
  # publish-release below).
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zoahdev/dsh-plugin-doctor-action@v1
        with:
          path: .

  test-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Bridge syntax check
        run: node --check src/bridge.mjs
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # pnpm pack prints the tarball it wrote; keep a leading ./ on bare
          # names so `plugin add` reads it as a path, not a registry package.
          file="$(pnpm pack | tail -1)"
          case "$file" in /*|[A-Za-z]:*) ;; *) file="./$file" ;; esac
          echo "tgz=$file" >> "$GITHUB_OUTPUT"
      - name: Packaged integration + real tool invocation
        run: node scripts/integration-test.mjs "${{ steps.pack.outputs.tgz }}"

  dsh-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # pnpm pack prints the tarball it wrote; keep a leading ./ on bare
          # names so `plugin add` reads it as a path, not a registry package.
          file="$(pnpm pack | tail -1)"
          case "$file" in /*|[A-Za-z]:*) ;; *) file="./$file" ;; esac
          echo "tgz=$file" >> "$GITHUB_OUTPUT"
      - name: Fresh DSH profile install + boot smoke
        shell: bash
        run: bash scripts/dsh-smoke.sh "${{ steps.pack.outputs.tgz }}"

  # Publishes the git-installable form of the plugin: prebuilt lib/ with no
  # lifecycle scripts, so a consumer's profile never has to run the `prepare`
  # build (which pnpm blocks for git-hosted packages).
  #
  # The build is committed as an orphan commit and published two ways:
  #   - tag `v<version>`, so `#semver:` ranges resolve to an installable tree:
  #       dsh plugin add "github:hojulian/modal-dsh#semver:0.1.0"
  #     This is why the tag is created here rather than pushed by hand — a tag
  #     on a source commit would resolve to the unbuildable source tree.
  #   - branch `release`, force-pushed, always pointing at the newest release.
  #
  # Manual trigger on `main` only; the test jobs must pass on the same commit.
  publish-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [doctor, test-and-load, dsh-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve version and check the tag is free
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::tag v${version} already exists; bump the version in package.json before releasing"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: pnpm run build
      - name: Assemble release tree
        run: node scripts/build-release-branch.mjs
      - name: Push release tag and branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: release-branch
        run: |
          set -euo pipefail
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "release v${VERSION}" -m "Built by ci.yml from ${GITHUB_SHA}. Do not commit here; edit main."
          git tag "v${VERSION}"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q "$remote" "v${VERSION}"
          git push -q --force "$remote" release
